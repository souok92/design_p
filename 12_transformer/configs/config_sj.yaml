# Configuration for SJ model training with TimeSformer
# GPU: RTX 5070 Ti (16GB VRAM)

# Data settings
data:
  data_dir: "../00_data"
  person: "sj"
  sequence_length: 8
  stride: 2
  batch_size: 8
  num_workers: 4
  augment: true
  image_size: 224

# Model settings
model:
  model_type: "timesformer_small"
  num_frames: 8
  image_size: 224
  patch_size: 16
  num_outputs: 8
  dropout: 0.2

# Training settings
training:
  num_epochs: 100
  learning_rate: 0.0001
  weight_decay: 0.01
  optimizer: "AdamW"
  scheduler: "CosineAnnealingWarmRestarts"
  T_0: 20
  T_mult: 2
  early_stopping_patience: 30
  gradient_clip: 1.0
  warmup_epochs: 5
  label_smoothing: 0.0

# Loss settings
loss:
  type: "SmoothL1"

# Logging and checkpointing
logging:
  log_interval: 10
  checkpoint_dir: "./checkpoints/sj"
  log_dir: "./logs/sj"
  save_best_only: true
  save_last: true

# Seed for reproducibility
seed: 42
